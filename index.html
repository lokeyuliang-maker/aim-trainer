<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Reflex Aim Trainer Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <h1>🎯 Elite Aim Trainer Pro</h1>
        
        <!-- Stats Bar -->
        <div class="scoreboard">
            <div>Score: <span id="score">0</span></div>
            <div>Time Left: <span id="timer">30</span>s</div>
            <div class="coins-display">💰 AimCoins: <span id="coins">0</span></div>
        </div>

        <!-- Controls Dashboard -->
        <div class="dashboard">
            <div class="control-group">
                <label>Game Mode:</label>
                <select id="game-mode">
                    <option value="classic">Classic Click</option>
                    <option value="flick">Flick Shot (Respawns Fast)</option>
                    <option value="tracking">Tracking (Hold Cursor On Target)</option>
                    <option value="boss">Boss Fight 👑</option>
                </select>
            </div>

            <div class="control-group">
                <label>Target Size:</label>
                <select id="target-size">
                    <option value="large">Large</option>
                    <option value="medium" selected>Medium</option>
                    <option value="small">Small</option>
                </select>
            </div>
        </div>

        <!-- Main Game Window -->
        <div id="game-area">
            <div id="custom-crosshair"></div>
            <button id="start-btn">START GAME</button>
            <div id="target"></div>
            <div id="boss-hp-bar"><div id="boss-hp-inner"></div></div>
        </div>
        
        <!-- In-Game Shop -->
        <div class="shop-container">
            <h3>🛒 AimCoin Crosshair Shop</h3>
            <div class="shop-items">
                <button class="shop-item unlocked" data-skin="default" data-cost="0">Default Dot (Free)</button>
                <button class="shop-item" data-skin="cross" data-cost="50">🔒 Plus Crosshair (50 💰)</button>
                <button class="shop-item" data-skin="circle" data-cost="100">🔒 Tactical Circle (100 💰)</button>
                <button class="shop-item" data-skin="diamond" data-cost="200">🔒 Diamond Wrap (200 💰)</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
